name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REPO: dds-devops-demo   # nombre del repositorio en Docker Hub

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular nombres de imagen y SHA corto
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          GHCR_IMAGE="${GHCR_REGISTRY}/${GITHUB_REPOSITORY}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPO}" >> "$GITHUB_ENV"

      # La imagen se construye UNA sola vez
      - name: Build de la imagen
        run: docker build -t local-build:${SHORT_SHA} .

      - name: Verificar que la app responde "Hola DevOps"
        run: |
          docker run -d --rm --name app -p 8080:80 local-build:${SHORT_SHA}
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080 | grep -q "Hola DevOps"; then
              echo "OK: la aplicación responde correctamente"
              docker stop app
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: la aplicación no devolvió el mensaje esperado"
          docker logs app || true
          docker stop app || true
          exit 1

      # Solo se publica en push a main (no en pull requests)
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar la misma imagen para ambos registros
        if: github.event_name == 'push'
        run: |
          for TAG in "${SHORT_SHA}" latest; do
            docker tag local-build:${SHORT_SHA} "${GHCR_IMAGE}:${TAG}"
            docker tag local-build:${SHORT_SHA} "${DOCKERHUB_IMAGE}:${TAG}"
          done

      - name: Publicar en GHCR
        if: github.event_name == 'push'
        run: |
          docker push "${GHCR_IMAGE}:${SHORT_SHA}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Publicar en Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push "${DOCKERHUB_IMAGE}:${SHORT_SHA}"
          docker push "${DOCKERHUB_IMAGE}:latest"
